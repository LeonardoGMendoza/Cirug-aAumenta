<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cirurgia Aumentada</title>
<style>
:root{--bg:#0e1a1f;--pn:#14262d;--ln:#2a444d;--fg:#e8f1f0;--mu:#8fa9ad;--ac:#3fd0b0;--er:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{display:block}
.hud{position:fixed;top:10px;left:10px;width:min(320px,calc(100vw - 20px));background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;max-height:calc(100vh - 80px);overflow:auto}
h1{font:600 17px/1.2 Georgia,serif;margin:0 0 10px}
label{display:block;color:var(--mu);font-size:13px;margin:8px 0 3px}
select,input[type=range]{width:100%}
select{background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:8px;font-size:15px}
ol{margin:10px 0 0;padding:0;list-style:none}
li{padding:7px 8px;border-left:3px solid var(--ln);color:var(--mu);margin-bottom:4px}
li.on{border-color:var(--ac);color:var(--fg);background:#1a3a40}
li.ok{border-color:#3f8f6f;text-decoration:line-through}
#msg{margin-top:8px;min-height:22px;font-weight:600}
button.r{margin-top:8px;background:none;color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:7px 12px;font-size:14px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mu);font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="hud" id="hud">
  <h1>Cirurgia aumentada</h1>
  <label for="org">Cirurgia</label>
  <select id="org">
    <option value="rim">Rim: pedra nos rins</option>
    <option value="coracao">Coração: ponte coronária</option>
    <option value="cerebro">Cérebro: tumor</option>
    <option value="rosto">Rosto: implante de silicone</option>
  </select>
  <label for="op">Transparência da camada externa</label>
  <input id="op" type="range" min="10" max="100" value="45">
  <div class="chk"><input id="hint" type="checkbox" checked><label for="hint" style="margin:0">Mostrar dicas (desligue para modo prova)</label></div>
  <ol id="steps"></ol>
  <div id="msg" role="status"></div>
  <button class="r" id="reset">Reiniciar</button>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {ARButton} from 'three/addons/webxr/ARButton.js';

const $=s=>document.querySelector(s);
const scene=new THREE.Scene(),BG=new THREE.Color(0x0e1a1f);scene.background=BG;
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,100);cam.position.set(0,.4,3.6);
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
r.setPixelRatio(devicePixelRatio);r.setSize(innerWidth,innerHeight);r.xr.enabled=true;document.body.prepend(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x223344,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(2,3,3);scene.add(dl);
const oc=new OrbitControls(cam,r.domElement);oc.enableDamping=true;
const rig=new THREE.Group();scene.add(rig);

// ---------- modelos procedurais ----------
let shells=[];
const mat=(c,o)=>new THREE.MeshPhysicalMaterial({color:c,roughness:.5,clearcoat:.35,transparent:true,opacity:o,depthWrite:false});
const sh=(geo,c)=>{const m=mat(c,.45);shells.push(m);return new THREE.Mesh(geo,m)};
const S=(rad,x,y,z,c,p=[0,0,0])=>{const m=sh(new THREE.SphereGeometry(rad,48,32),c);m.scale.set(x,y,z);m.position.set(...p);return m};
const C=(rt,rb,h,c,p,rot=[0,0,0])=>{const m=sh(new THREE.CylinderGeometry(rt,rb,h,24),c);m.position.set(...p);m.rotation.set(...rot);return m};

const ORG={
 rim:{
  build:g=>{g.add(S(1,1,1.3,.6,0xa5483e));g.add(C(.1,.14,1,0xe3b562,[.7,-.3,0],[0,0,1.2]));g.add(C(.14,.14,1,0x5a78b0,[.55,.35,0],[0,0,1.4]))},
  tg:[[0,-.1,.57],[.15,-.2,.15]],
  st:[{t:0,x:'Marque o ponto de acesso na superfície do rim'},{t:1,x:'Alcance o cálculo renal (a pedra)'},{t:1,x:'Fragmente a pedra com o laser'}]},
 coracao:{
  build:g=>{g.add(S(1,.95,1.1,.85,0xb5303a));g.add(C(.18,.22,.9,0xd9a0a0,[.2,1.15,0],[0,0,-.3]));g.add(C(.14,.14,.8,0x4a6fa5,[-.45,1.1,-.1]))},
  tg:[[.35,.25,.75],[.55,-.2,.65],[-.3,.1,.7]],
  st:[{t:0,x:'Localize a artéria coronária obstruída'},{t:1,x:'Posicione o enxerto da ponte, após a obstrução'},{t:2,x:'Confira a válvula'}]},
 cerebro:{
  build:g=>{const m=S(1,1.1,.9,1.3,0xd7a3a8);const p=m.geometry.attributes.position;
   for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const k=1+.05*Math.sin(x*9)*Math.sin(y*8+z*6);p.setXYZ(i,x*k,y*k,z*k)}
   m.geometry.computeVertexNormals();g.add(m);g.add(S(.45,1,.7,1,0xc48a90,[0,-.6,-.9]));g.add(C(.14,.12,.8,0xc48a90,[0,-.85,-.3],[.4,0,0]))},
  tg:[[0,.85,.3],[.3,.1,.1]],
  st:[{t:0,x:'Marque o ponto de entrada (craniotomia)'},{t:1,x:'Avance pela trajetória até o tumor'},{t:1,x:'Ressecte o tumor'}]},
 rosto:{
  build:g=>{g.add(S(1,.8,1.05,.85,0xe0b090));g.add(C(0,.13,.4,0xe0b090,[0,-.05,.85],[Math.PI/2,0,0]));
   [-.3,.3].forEach(x=>g.add(S(.08,1,1,1,0x222222,[x,.2,.78])))},
  tg:[[-.55,-.15,.6],[.55,-.15,.6],[0,-.05,.97]],
  st:[{t:0,x:'Posicione o implante de silicone malar esquerdo'},{t:1,x:'Posicione o implante malar direito'},{t:2,x:'Confira a simetria (toque o nariz)'}]}
};

// ---------- estado da cirurgia ----------
let key='rim',grp,tg=[],step=0,errs=0,t0=0,last=null;
const mk=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,depthTest:false});

function load(k){
  key=k;if(grp)rig.remove(grp);shells=[];grp=new THREE.Group();ORG[k].build(grp);rig.add(grp);
  tg=ORG[k].tg.map(p=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),mk(0x3fd0b0));m.position.set(...p);m.renderOrder=5;grp.add(m);return m});
  step=0;errs=0;last=null;t0=Date.now();applyOp();ui();$('#msg').textContent='';
}
function applyOp(){const o=$('#op').value/100;shells.forEach(m=>m.opacity=o)}
function ui(){
  const st=ORG[key].st;
  $('#steps').innerHTML=st.map((s,i)=>`<li class="${i<step?'ok':i==step?'on':''}">${s.x}</li>`).join('');
  tg.forEach((t,i)=>{const cur=step<st.length&&st[step].t==i;t.material.opacity=(cur&&$('#hint').checked)?1:0});
}
function msg(t,c){const m=$('#msg');m.textContent=t;m.style.color=c}

const rc=new THREE.Raycaster();
function tap(){
  const st=ORG[key].st;if(step>=st.length)return;
  const t=tg[st[step].t];
  if(rc.intersectObject(t).length){
    t.material.color.set(0x7dd87d);t.material.opacity=.9;
    if(last&&last!==t){grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([last.position,t.position]),new THREE.LineBasicMaterial({color:0xffd24a,depthTest:false})))}
    last=t;step++;ui();
    if(step>=st.length){const s=Math.round((Date.now()-t0)/1000);msg(`Concluída em ${s}s, ${errs} erro(s). Nota: ${Math.max(0,100-errs*10)}`,'#7dd87d')}
    else msg('Correto ✓','#7dd87d');
  }else if(rc.intersectObject(grp,true).some(h=>!tg.includes(h.object))){errs++;msg('Estrutura errada ✗','#ff6b5e')}
}

// ---------- entrada: mouse/toque e controles de RA ----------
let d0;
r.domElement.addEventListener('pointerdown',e=>d0=[e.clientX,e.clientY]);
r.domElement.addEventListener('pointerup',e=>{
  if(r.xr.isPresenting||!d0||Math.hypot(e.clientX-d0[0],e.clientY-d0[1])>6)return;
  rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);tap()});
[0,1].forEach(i=>{
  const c=r.xr.getController(i);
  c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1.5)]),new THREE.LineBasicMaterial({color:0x3fd0b0})));
  c.addEventListener('select',()=>{rc.ray.origin.setFromMatrixPosition(c.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(new THREE.Matrix4().extractRotation(c.matrixWorld));tap()});
  scene.add(c)});

r.xr.addEventListener('sessionstart',()=>{scene.background=null;oc.enabled=false;rig.scale.setScalar(.22);rig.position.set(0,-.05,-.7)});
r.xr.addEventListener('sessionend',()=>{scene.background=BG;oc.enabled=true;rig.scale.setScalar(1);rig.position.set(0,0,0)});
document.body.appendChild(ARButton.createButton(r,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}}));

$('#org').onchange=e=>load(e.target.value);
$('#op').oninput=applyOp;$('#hint').onchange=ui;$('#reset').onclick=()=>load(key);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});

load('rim');
r.setAnimationLoop(t=>{
  const st=ORG[key].st;if(step<st.length){const m=tg[st[step].t];m.scale.setScalar(1+.25*Math.sin(t/200))}
  oc.update();r.render(scene,cam)});
</script>
</body>
</html>
